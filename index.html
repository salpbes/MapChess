<!doctype html>
<!--
  WHAT: The single HTML page MapChess runs in.
  HOW:  Vite injects the bundled `src/app/main.ts`. The page has one full-screen
        container for the three.js canvas and one for the DOM UI overlay.
  WHY:  Keeping the canvas and the overlay as siblings (not nested) lets the UI
        layer own its DOM without ever reaching into the renderer's element.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      A seatbelt for a bug not yet written. There is no injection sink in this
      app today — no innerHTML, no eval, every external name goes to
      textContent — so nothing here is load-bearing. It is here so that the day
      one appears, it does not also get to run.

      GitHub Pages serves no custom headers, so this is a meta tag, which means
      `frame-ancestors` is ignored and clickjacking stays unmitigated. That is
      accepted: the page has no accounts, no cookies and no action worth
      tricking somebody into clicking.

      script-src is the directive doing the real work, and it keeps the part
      that matters most: with no `unsafe-inline`, an injected <script> or event
      handler does not run, and no off-origin script loads.

      `unsafe-eval` is a concession, made with the measurement in hand rather
      than pre-emptively. three's KTX2Loader runs the basis transcoder in a Blob
      worker, and the transcoder is Emscripten embind, which builds its invoker
      functions with `new Function` while the wasm module registers itself.
      Blob workers inherit this policy, so refusing eval kills the transcoder:
      probed on a real board, every piece came back `NO TEXTURE`. It is not
      reachable through configuration — the worker is three's to construct — so
      the choice was eval or untextured pieces.

      What that costs is narrower than it looks. An attacker still cannot get a
      script to run in the first place; eval only matters to somebody who
      already has execution, or through a gadget that evals data, and this app
      evals nothing itself.

      `blob:` is there for that same worker, and `wasm-unsafe-eval` because
      Stockfish and the transcoder are both WebAssembly.

      `blob:` on connect-src is not optional: three's GLTFLoader fetches a
      model's KTX2 texture back out of a Blob URL, and without it the pieces
      arrive untextured. That was caught only by pointing this at the real
      network — every fenced test passed while it was broken.

      connect-src and img-src are deliberately left at `https:` rather than a
      list of hosts. The map pulls from Overpass with a fallback endpoint,
      Nominatim, Wikidata, openfreemap and an S3 bucket that redirects, and a
      host missed from that list would break the live map in a way the tests
      cannot catch — they fence the network off. The exchange is a fair one:
      there are no secrets in this app to exfiltrate, and the directive still
      rules out plain http and data: URLs.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' blob: 'wasm-unsafe-eval' 'unsafe-eval';
               worker-src 'self' blob:;
               style-src 'self' 'unsafe-inline';
               img-src 'self' data: blob: https:;
               font-src 'self' data:;
               connect-src 'self' blob: https:;
               object-src 'none';
               base-uri 'self';
               form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MapChess</title>
    <!-- Inline, so a tab icon costs no request and cannot 404 on a subpath. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%232a2d33%22/><path d=%22M6 22h20l-3 4H9z%22 fill=%22%235c8a4a%22/><path d=%22M16 5a4 4 0 0 0-2.4 7.2C12.2 13.2 11.5 15 11.3 17h9.4c-.2-2-.9-3.8-2.3-4.8A4 4 0 0 0 16 5z%22 fill=%22%23e9dec4%22/><path d=%22M11.6 18.6h8.8L19 22h-6z%22 fill=%22%23e9dec4%22/></svg>"
    />
    <link rel="stylesheet" href="/src/app/styles.css" />
  </head>
  <body>
    <div id="world"></div>
    <div id="ui"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
