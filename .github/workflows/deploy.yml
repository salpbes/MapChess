# WHAT: Builds MapChess and publishes it to GitHub Pages.
# HOW:  Every push to main runs the same gates the project runs locally — lint,
#       formatting, types, unit tests, then the journeys in a real browser at
#       desktop and phone widths — and only then builds and deploys. The engine
#       binaries are not in the repository (`public/engine/` is ignored);
#       `npm ci` runs the postinstall that copies them out of node_modules.
# WHY:  A deploy that skips the suite is a deploy that ships a red build. The
#       unit gates are cheap — under two seconds — and the journeys cost a
#       couple of minutes, which is the price of knowing the page a stranger
#       opens actually starts, plays and resumes on a phone as well as a
#       desktop. Every regression Phase 12 shipped was invisible to the unit
#       suite and obvious to a browser.

name: Deploy

on:
  push:
    branches: [main]
  # So a deploy can be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue the second rather than cancelling it, so
# the last push to main is always the one that ends up published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `ci`, not `install`: the lockfile is the point, and postinstall puts
      # the Stockfish build into public/engine/ where the bundler expects it.
      - run: npm ci

      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

      # Chromium only: the suite runs one browser at two viewports, and pulling
      # three of them would cost more than the run it feeds.
      - run: npx playwright install --with-deps chromium

      # The journeys at both viewports. `test:e2e` builds and serves the site
      # itself, so this is the same `dist/` the deploy publishes — and a red
      # journey stops the publish, which is the whole point of it being here
      # rather than in a separate workflow that nobody blocks on.
      - run: npm run test:e2e

      # `base: './'` means the output works from any path, so nothing here
      # needs to know the repository name.
      - run: npm run build

      - name: Keep the traces of anything that failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
